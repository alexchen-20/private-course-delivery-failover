[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "private-course-delivery-failover"
version = "0.1.0"
description = "Privacy-scoped course delivery with cross-vendor model routing through Infrai."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.55,<2",
  "pydantic>=2.9,<3",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/course_delivery"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
